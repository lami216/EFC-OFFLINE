name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable was not found." }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          Write-Host "Executable: $($exe.FullName)"
          Write-Host "PE subsystem: $subsystem (2 = Windows GUI, 3 = Console)"
          if ($subsystem -ne 2) {
            throw "The release executable is not a Windows GUI binary. A console window could appear."
          }

      - name: Smoke-test release startup
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          $startupLog = Join-Path $env:TEMP "centre-efc-startup.log"
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            if (Test-Path $startupLog) {
              Write-Host "---- startup log ----"
              Get-Content $startupLog
              Write-Host "---------------------"
            }
            throw "Centre EFC exited during the startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Centre EFC stayed alive during the startup smoke test."

      - uses: actions/upload-artifact@v4
        with:
          name: EFC-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
