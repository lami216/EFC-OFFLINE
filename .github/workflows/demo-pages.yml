name: EFC Browser Demo

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo JavaScript
        run: |
          node --check demo-app.js
          node --check demo-period-merge.js
          node --check demo-monthly-finance-v3.js
          node --check demo-receipts-v4.js
          node --check demo-v5-runtime-guard.js
          node --check demo-brand-receipt-v5.js
          node --check demo-repair-v6.js
          node --check demo-receipt-layout-v7.js
          node --check demo-fix-v8.js
          node --check demo-receipt-logo-v9.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
